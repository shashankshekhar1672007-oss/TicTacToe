<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <!-- Google Fonts: Plus Jakarta Sans for clean, human, non-AI aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheet with cache buster -->
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <main class="app-card">
        <!-- Card Header: Title & Theme Toggle Button -->
        <header class="card-header">
            <div class="header-content">
                <div class="title-row">
                    <span class="badge-icon">🎮</span>
                    <h1 class="game-title">Tic Tac Toe</h1>
                </div>
                <p class="game-subtitle">Choose your mode and challenge your opponent!</p>
            </div>
            <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle color theme" title="Switch to dark mode">
                <span class="theme-icon" id="themeIcon">☀️</span>
            </button>
        </header>

        <!-- Mode Selector -->
        <div class="mode-selector" role="tablist" aria-label="Select Game Mode">
            <button class="mode-btn" id="modePvp" data-mode="pvp">
                <span class="mode-btn-icon">👥</span>
                <span>2 Players</span>
            </button>
            <button class="mode-btn active" id="modeAi" data-mode="ai">
                <span class="mode-btn-icon">🤖</span>
                <span>vs Computer</span>
            </button>
        </div>

        <!-- Scoreboard (matches Rock Paper Scissors 3-card layout) -->
        <section class="scoreboard" aria-label="Scoreboard">
            <!-- Score: Player X / You -->
            <div class="score-card player-x">
                <div class="score-icon-box user-box">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <div class="score-info">
                    <span class="score-label" id="playerXLabel">YOU</span>
                    <span class="score-value" id="scoreX">0</span>
                </div>
            </div>

            <!-- Score: Ties -->
            <div class="score-card ties">
                <div class="score-icon-box tie-box">
                    <span>🤝</span>
                </div>
                <div class="score-info">
                    <span class="score-label">TIES</span>
                    <span class="score-value" id="scoreTies">0</span>
                </div>
            </div>

            <!-- Score: Player O / Computer -->
            <div class="score-card player-o">
                <div class="score-icon-box bot-box" id="botIconBox">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M19 11h-1V9a5 5 0 0 0-5-5V3a1 1 0 0 0-2 0v1a5 5 0 0 0-5 5v2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2zm-9-2a3 3 0 0 1 3-3 3 3 0 0 1 3 3v2h-6V9zm8 9H6v-4h12v4zm-8-3a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm6 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/>
                    </svg>
                </div>
                <div class="score-info">
                    <span class="score-label" id="playerOLabel">COMPUTER</span>
                    <span class="score-value" id="scoreO">0</span>
                </div>
            </div>
        </section>

        <!-- Status Banner (matches Rock Paper Scissors "Ready to Play!" banner) -->
        <section class="status-banner" id="statusBanner">
            <h2 class="status-headline" id="statusHeadline">Ready to Play!</h2>
            <p class="status-subtext" id="statusSubtext">Click any square below to start.</p>
        </section>

        <!-- Game Board Container -->
        <div class="board-container">
            <div class="board" id="board" role="grid" aria-label="Tic Tac Toe Board">
                <button class="cell" data-index="0" aria-label="Square 1 (Top Left)"></button>
                <button class="cell" data-index="1" aria-label="Square 2 (Top Center)"></button>
                <button class="cell" data-index="2" aria-label="Square 3 (Top Right)"></button>
                <button class="cell" data-index="3" aria-label="Square 4 (Middle Left)"></button>
                <button class="cell" data-index="4" aria-label="Square 5 (Middle Center)"></button>
                <button class="cell" data-index="5" aria-label="Square 6 (Middle Right)"></button>
                <button class="cell" data-index="6" aria-label="Square 7 (Bottom Left)"></button>
                <button class="cell" data-index="7" aria-label="Square 8 (Bottom Center)"></button>
                <button class="cell" data-index="8" aria-label="Square 9 (Bottom Right)"></button>
            </div>
        </div>

        <!-- Controls (Matches Rock Paper Scissors outlined reset button) -->
        <div class="controls-container">
            <button class="reset-btn" id="restartBtn" title="Reset current board">
                <span class="reset-icon">↺</span>
                <span>Reset Game</span>
            </button>
            <button class="reset-scores-link" id="resetScoreBtn">Reset All Scores</button>
        </div>

        <!-- Keyboard Shortcut Hint (Matches RPS footer) -->
        <footer class="keyboard-hint">
            <span class="hint-icon">⌨️</span>
            <span>Shortcut: Press <kbd>1</kbd>–<kbd>9</kbd> on keys, or <kbd>R</kbd> to reset</span>
        </footer>
    </main>

    <!-- JavaScript with cache buster -->
    <script src="script.js?v=3"></script>
</body>
</html>
